name: Content validate
on:
  workflow_dispatch:
  pull_request:
    paths: ['content/**', '.github/workflows/content-*.yml']
  push:
    branches: [main]
    paths: ['content/**', '.github/workflows/content-*.yml']
defaults:
  run:
    working-directory: content
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: content/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
