name: Content index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['content/**', '!content/index.json']
permissions:
  contents: write
defaults:
  run:
    working-directory: content
concurrency:
  group: content-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: content/package-lock.json
      - run: npm ci
      - run: npm run validate
      - name: Build and commit index (retries if main moves)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            GITHUB_SHA=$(git rev-parse HEAD) npm run build-index
            git add index.json
            if git diff --cached --quiet; then echo "index unchanged"; exit 0; fi
            git commit -m "chore: update content index"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved; retrying ($attempt)"
          done
          exit 1
